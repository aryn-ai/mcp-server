permissions:
  contents: write
name: Build DXT Extension

on:
  release:
    types: [published]

jobs:
  build-dxt-extension:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install DXT tool globally
      run: npm install -g @anthropic-ai/dxt

    - name: Create and activate virtual environment
      run: |
        uv venv .venv

    - name: Copy uv binaries into venv (Linux/macOS)
      run: |
        cp $HOME/.local/bin/uv .venv/bin/uv
        cp $HOME/.local/bin/uvx .venv/bin/uvx
        chmod +x .venv/bin/uv .venv/bin/uvx
        ls -la .venv/bin/

    - name: test installed uvx 
      run: |
        .venv/bin/uvx --version

    - name: Run DXT pack
      run: |
        dxt pack

    - name: List generated files
      run: ls -la
    
    - name: Upload DXT Extension Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./mcp-server.dxt
        asset_name: mcp-server-${{ matrix.os }}.dxt
        asset_content_type: application/octet-stream

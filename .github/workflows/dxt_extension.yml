permissions:
  contents: write
name: Build DXT Extension

on:
  release:
    types: [published]

jobs:
  build-dxt-extension:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install DXT tool globally
      run: npm install -g @anthropic-ai/dxt

    - name: Create and activate virtual environment
      run: |
        uv venv .venv
        uv sync

    - name: Prune .venv before packaging
      run: |
        # Remove caches and bytecode
        find .venv -type d -name "__pycache__" -exec rm -rf {} +
        find .venv -type f -name "*.pyc" -delete

        # Remove common dev-only packages
        rm -rf .venv/lib/python*/site-packages/pip*
        rm -rf .venv/lib/python*/site-packages/setuptools*
        rm -rf .venv/lib/python*/site-packages/wheel*
        rm -rf .venv/lib/python*/site-packages/twine*
        rm -rf .venv/lib/python*/site-packages/pre_commit*
        rm -rf .venv/lib/python*/site-packages/pytest*
        rm -rf .venv/lib/python*/site-packages/_distutils*

        # Remove metadata (safe for runtime)
        rm -rf .venv/lib/python*/site-packages/*.dist-info
        rm -rf .venv/lib/python*/site-packages/*.egg-info

    - name: Run DXT pack command
      run: |
        dxt pack

    - name: List generated files
      run: |
        echo "Generated files:"
        ls -la *.dxt || echo "No .dxt files found"

    - name: Upload DXT Extension Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./mcp-server.dxt
        asset_name: mcp-server-extension.dxt
        asset_content_type: application/octet-stream
